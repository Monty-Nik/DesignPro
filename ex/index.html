<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расположение как на картинке</title>
    <style>
        .wrapper {
            position: relative;
            max-width: 500px;
            margin: 50px;
            font-family: Arial, sans-serif;
        }

        .input-text {
            background-color: #f8f9fa;
            padding: 5px 10px;
            border-radius: 10px;
            border: 2px solid #dee2e6;
            margin-right: 150px;
            position: absolute;
            right: -285px;
            top: 60px;
        }

        .labels-column {
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            gap: 95px;
        }

        .label {
            background-color: #4a5568;
            color: white;
            padding: 5px 15px;
            border-radius: 8px;
            text-align: right;
            min-width: 120px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="text-block">
        <input type="text" class="input-text">
    </div>

    <div class="labels-column">
        <div class="label">Label</div>
        <div class="label">Label</div>
    </div>
</div>
</body>
</html>
